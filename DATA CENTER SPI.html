<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DATA CENTER SPI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap">
<style>
:root{--bg:#f1f4f9;--panel:#fff;--ink:#12233f;--muted:#5b6b85;--line:#cdd6e4;--navy:#12233f;--amber:#f2a900;--on-navy:#fff;--accent:#1d4f9f;--on-accent:#fff;--danger:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1424;--panel:#13213a;--ink:#e8eef9;--muted:#9fb0cc;--line:#2a3d5e;--navy:#0a1220;--accent:#7fb0ff;--on-accent:#06142b;--danger:#ff8a80}}
:root[data-theme="dark"]{--bg:#0b1424;--panel:#13213a;--ink:#e8eef9;--muted:#9fb0cc;--line:#2a3d5e;--navy:#0a1220;--accent:#7fb0ff;--on-accent:#06142b;--danger:#ff8a80}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Plus Jakarta Sans",system-ui,sans-serif}
h1,h2,h3{margin:0;line-height:1.2}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
label{display:block;font-weight:600;font-size:.85rem;margin:10px 0 4px}
button{font:inherit;font-weight:600;cursor:pointer;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);padding:7px 14px}
button.ghost{background:transparent;color:var(--accent)}
button.warn{background:transparent;color:var(--danger);border-color:var(--danger)}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.muted{color:var(--muted);font-size:.85rem}
.err{color:var(--danger);font-weight:600;min-height:1.4em;margin-top:8px}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px 16px}
#lf{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-top:6px solid var(--amber);border-radius:10px;padding:24px;text-align:center}
#lf label,#lf input{text-align:left}
#lf button{width:100%;margin-top:16px;padding:10px}
.logo{max-height:64px;max-width:160px;object-fit:contain}
#logo-l{max-height:130px;max-width:130px;border-radius:50%;margin-bottom:8px}
.mark{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:12px;background:var(--navy);color:var(--amber);font-weight:800;letter-spacing:1px;margin-bottom:8px}
header{background:var(--navy);color:var(--on-navy);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;border-bottom:4px solid var(--amber)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.5px}
.brand .logo{max-height:44px;border-radius:50%}.brand .mark{width:38px;height:38px;margin:0;font-size:.8rem}
.who{display:flex;align-items:center;gap:10px;font-size:.9rem}
.who button{background:transparent;color:var(--on-navy);border-color:var(--on-navy);padding:5px 12px}
.role{background:var(--amber);color:#12233f;border-radius:99px;padding:1px 10px;font-weight:800;font-size:.75rem}
nav{display:flex;gap:6px;padding:10px 16px 0;max-width:1000px;margin:0 auto}
nav button{background:transparent;color:var(--muted);border:0;border-bottom:3px solid transparent;border-radius:0}
nav button.on{color:var(--ink);border-bottom-color:var(--amber)}
.wrap{max-width:1000px;margin:0 auto;padding:14px 16px 48px}
.cols{display:grid;grid-template-columns:240px 1fr;gap:16px}
@media (max-width:720px){.cols{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.fbtn{display:flex;justify-content:space-between;width:100%;text-align:left;background:transparent;color:var(--ink);border:1px solid transparent;margin-bottom:4px}
.fbtn.on{background:var(--bg);border-color:var(--amber);border-left-width:5px}
.gh{font-weight:800;font-size:.75rem;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:16px 0 6px;border-bottom:2px solid var(--amber);padding-bottom:3px}
.gh:first-child{margin-top:0}
.crumb{font-size:.8rem;color:var(--muted);margin-bottom:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.file{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:8px;background:var(--bg)}
.file .info{flex:1;min-width:0}.file b{display:block;overflow-wrap:anywhere}
.badge{flex:none;width:46px;text-align:center;font-weight:800;font-size:.7rem;padding:8px 0;border-radius:6px;color:#fff}
.PDF{background:#c0392b}.DOCX{background:#2b5cb8}.XLSX{background:#1e7e45}.PPTX{background:#c4561b}
.grid2{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:end}
@media (max-width:720px){.grid2{grid-template-columns:1fr}}
.urow{display:grid;grid-template-columns:1.2fr 110px 1fr auto auto;gap:8px;align-items:center;border-top:1px solid var(--line);padding:10px 0}
@media (max-width:720px){.urow{grid-template-columns:1fr}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;max-width:92vw;border-left:5px solid var(--amber)}
</style>
</head>
<body>

<div id="login" class="center">
<form id="lf" novalidate>
<img id="logo-l" class="logo" alt="Logo SPI" hidden>
<div id="mark-l" class="mark">SPI</div>
<h1>DATA CENTER SPI</h1>
<p class="muted">Masuk untuk mengelola berkas</p>
<label for="user">Nama pengguna</label>
<input id="user" autocomplete="username" autocapitalize="none" spellcheck="false">
<label for="pass">Kata sandi</label>
<input id="pass" type="password" autocomplete="current-password">
<button type="submit">Masuk</button>
<div id="lm" class="err" role="alert"></div>
</form>
</div>

<div id="app" hidden>
<header>
<div class="brand"><img id="logo-h" class="logo" alt="Logo SPI" hidden><span id="mark-h" class="mark">SPI</span>DATA CENTER SPI</div>
<div class="who"><span id="who"></span><span id="role" class="role"></span><button id="out" type="button">Keluar</button></div>
</header>
<nav><button data-t="berkas" class="on">Berkas</button><button data-t="admin" id="tab-admin" hidden>Kelola pengguna</button></nav>

<div class="wrap" id="v-berkas">
<div class="cols">
<aside>
<div class="card">
<h2 style="font-size:1rem;margin-bottom:10px">Folder</h2>
<div id="fl"></div>
<div id="fadd" hidden>
<label for="ng">Tambah folder baru (admin)</label>
<select id="ng"></select>
<div class="row" style="margin-top:6px"><input id="nf" maxlength="40" placeholder="Nama folder" style="flex:1;min-width:120px"><button id="af" type="button">Tambah</button></div>
<p class="muted" style="margin:6px 0 0">Subfolder ditambahkan dari halaman folder yang dipilih.</p>
<label for="ngn">Tambah kelompok baru (admin)</label>
<div class="row"><input id="ngn" maxlength="50" placeholder="Nama kelompok" style="flex:1;min-width:120px"><button id="agp" type="button">Tambah</button></div>
</div>
</div>
</aside>
<section id="fp"></section>
</div>
</div>

<div class="wrap" id="v-admin" hidden>
<div class="card">
<h2 style="font-size:1.05rem;margin-bottom:6px">Tambah pengguna</h2>
<div class="grid2">
<div><label for="nu">Nama pengguna</label><input id="nu" maxlength="30"></div>
<div><label for="np">Kata sandi</label><input id="np" type="password" autocomplete="new-password"></div>
<div><label for="nr">Peran</label><select id="nr"><option value="user">User</option><option value="admin">Admin</option></select></div>
<button id="au" type="button">Tambah</button>
</div>
</div>
<div class="card"><h2 style="font-size:1.05rem">Daftar pengguna</h2><div id="ul"></div></div>
<div class="card">
<h2 style="font-size:1.05rem;margin-bottom:6px">Logo</h2>
<p class="muted">Unggah logo SPI (PNG, JPG, atau WebP, maksimal 400 KB).</p>
<div class="row"><input id="lg" type="file" accept="image/png,image/jpeg,image/webp" style="flex:1;min-width:200px"><button id="lgx" class="warn" type="button">Kembalikan logo bawaan</button></div>
</div>
</div>
<div id="toast" role="status" hidden></div>
</div>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var DEFG=[{id:"kepala",nama:"Kepala SPI"},{id:"teknik",nama:"Bagian Teknik"},{id:"adm",nama:"Bagian Administrasi dan Keuangan"}];
var M={folders:[],users:[],groups:DEFG.slice()},files=[],cur=null,me=null,editF=false,SES="spi-sesi",gagal=0,kunci=0,tt;
function h(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function ls(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function toast(t,lama){var e=$("toast");e.textContent=t;e.hidden=false;clearTimeout(tt);tt=setTimeout(function(){e.hidden=true},lama?9000:4500)}
function saveM(){if(!lsSet("spi-meta",JSON.stringify(M)))toast("Penyimpanan peramban tidak tersedia. Perubahan bisa hilang.")}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function norm(s){return String(s).toLowerCase().replace(/\s+/g,"")}
function isAdmin(){return me&&me.role==="admin"}
function sha(t){
if(!window.crypto||!crypto.subtle)return Promise.reject(new Error("Peramban ini tidak mendukung login aman."));
return crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return("0"+x.toString(16)).slice(-2)}).join("")});
}
function hashPw(salt,pw){return sha(salt+":"+String(pw).replace(/\s+/g,""))}
function mk(u,p,role){var salt=uid()+uid();return hashPw(salt,p).then(function(x){return{key:norm(u),nama:u.trim(),role:role,salt:salt,hash:x}})}
function init(){
var m=ls("spi-meta");
if(m&&m.users&&m.users.length){M=m;if(!M.folders)M.folders=[];
var LEG={"laporan keuangan":"adm","arsip surat":"adm","laporan so":"teknik"},ch=false;
M.folders.forEach(function(f){if(!f.group){f.group=LEG[String(f.nama).toLowerCase()]||"kepala";ch=true}if(f.parent===undefined){f.parent=null;ch=true}});
if(!M.groups){M.groups=DEFG.slice();ch=true}
if(ch)saveM();return Promise.resolve()}
return Promise.all([mk("admin","admin 1","admin"),mk("user 1","user 1","user"),mk("user 2","user 2","user"),mk("user 3","user 3","user")]).then(function(us){
M.users=us;M.groups=DEFG.slice();M.folders=[["Produk Hukum","kepala"],["Indispliner","kepala"],["Laporan SO","teknik"],["Laporan Keuangan","adm"],["Arsip Surat","adm"]].map(function(a){return{id:uid(),nama:a[0],drive:"",group:a[1],parent:null}});saveM();
});
}
/* IndexedDB */
var DBP;
function db(){return DBP||(DBP=new Promise(function(ok,no){
if(!window.indexedDB){no(new Error("Penyimpanan berkas tidak tersedia di peramban ini."));return}
var r=indexedDB.open("spi-files",1);
r.onupgradeneeded=function(){var d=r.result,s=d.createObjectStore("meta",{keyPath:"id"});s.createIndex("folder","folder");d.createObjectStore("blobs")};
r.onsuccess=function(){ok(r.result)};r.onerror=function(){no(r.error)}}))}
function T(mode,names,fn){return db().then(function(d){return new Promise(function(ok,no){
var t=d.transaction(names,mode),st=names.map(function(n){return t.objectStore(n)}),rq=fn.apply(null,st);
t.oncomplete=function(){ok(rq&&rq.result)};t.onerror=t.onabort=function(){no(t.error||new Error("Gagal menyimpan."))}})})}
function loadFiles(){return T("readonly",["meta"],function(m){return m.getAll()}).then(function(a){files=a||[]},function(){files=[]})}
/* unduh via kemampuan downloads */
function simpanBiasa(nama,blob){
try{var u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=nama;a.rel="noopener";document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(u)},60000);return true}catch(e){return false}
}
function unduh(nama,blob){
function biasa(){
if(simpanBiasa(nama,blob))toast("Mengunduh "+nama+". Periksa folder Unduhan di peramban. Jika tidak muncul, izinkan unduhan untuk situs ini di pengaturan peramban.",1);
else toast("Unduhan diblokir peramban. Izinkan unduhan untuk situs ini lalu coba lagi.",1);
return Promise.resolve();
}
if(!window.claude||!claude.use)return biasa();
return claude.use("downloads").then(function(dl){
if(!dl)return biasa();
return dl.save({filename:nama,data:blob}).then(function(){toast("File "+nama+" dikirim ke perangkatmu. Periksa folder Unduhan.")},function(e){
var c=e&&e.code;
if(c==="declined"){toast("Unduhan dibatalkan.");return}
if(c==="rate_limited"){toast("Masih ada permintaan unduh yang terbuka. Tunggu sebentar lalu coba lagi.",1);return}
return biasa();
});
},function(){return biasa()});
}
/* login */
function tampil(on){
$("login").hidden=on;$("app").hidden=!on;
if(on){$("who").textContent=me.nama;$("role").textContent=me.role==="admin"?"ADMIN":"USER";$("tab-admin").hidden=!isAdmin();$("fadd").hidden=!isAdmin();tab("berkas");
loadFiles().then(function(){if(!cur||!M.folders.some(function(f){return f.id===cur}))cur=M.folders[0]&&M.folders[0].id;render()})}
else{$("pass").value="";$("lm").textContent=""}
}
function sesi(k){try{if(k)sessionStorage.setItem(SES,k);else sessionStorage.removeItem(SES)}catch(e){}}
$("lf").onsubmit=function(ev){
ev.preventDefault();var pm=$("lm"),sisa=Math.ceil((kunci-Date.now())/1000);
if(sisa>0){pm.textContent="Terlalu banyak percobaan. Coba lagi dalam "+sisa+" detik.";return}
var k=norm($("user").value),p=$("pass").value;
if(!k||!p){pm.textContent="Isi nama pengguna dan kata sandi.";return}
var u=M.users.filter(function(x){return x.key===k})[0];
(u?hashPw(u.salt,p):sha("x")).then(function(x){
if(u&&x===u.hash){gagal=0;me=u;sesi(u.key);tampil(true)}
else{gagal++;$("pass").value="";if(gagal>=5){kunci=Date.now()+30000;gagal=0;pm.textContent="Terlalu banyak percobaan. Coba lagi dalam 30 detik."}else pm.textContent="Nama pengguna atau kata sandi salah."}
},function(e){pm.textContent=e.message});
};
$("out").onclick=function(){sesi(null);me=null;tampil(false)};
function tab(t){
$("v-berkas").hidden=t!=="berkas";$("v-admin").hidden=t!=="admin";
document.querySelectorAll("nav button").forEach(function(b){b.className=b.dataset.t===t?"on":""});
if(t==="admin")renderUsers();
}
document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){if(b.dataset.t==="admin"&&!isAdmin())return;tab(b.dataset.t)}});
/* folder dan berkas */
function ext(n){var m=String(n).toLowerCase().match(/\.([a-z0-9]+)$/);return m?m[1]:""}
function fmt(b){return b<1024?b+" B":b<1048576?(b/1024).toFixed(1)+" KB":(b/1048576).toFixed(1)+" MB"}
var MIME={pdf:"application/pdf",docx:"application/vnd.openxmlformats-officedocument.wordprocessingml.document",xlsx:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",pptx:"application/vnd.openxmlformats-officedocument.presentationml.presentation"};
function render(){renderFolders();renderPanel()}
function fById(id){return M.folders.filter(function(x){return x.id===id})[0]}
function kids(g,p){return M.folders.filter(function(x){return x.group===g&&(x.parent||null)===(p||null)})}
function desc(id){var r=[];M.folders.forEach(function(x){if(x.parent===id){r.push(x.id);r=r.concat(desc(x.id))}});return r}
function dupe(g,p,n,skip){return kids(g,p).some(function(x){return x.id!==skip&&norm(x.nama)===norm(n)})}
function gname(id){var g=M.groups.filter(function(x){return x.id===id})[0];return g?g.nama:""}
function cnt(id){return files.filter(function(x){return x.folder===id}).length}
function fillSel(){var s=$("ng"),v=s.value;s.innerHTML="";M.groups.forEach(function(g){var o=h("option","",g.nama);o.value=g.id;s.appendChild(o)});if(v&&M.groups.some(function(g){return g.id===v}))s.value=v}
$("agp").onclick=function(){
if(!isAdmin())return;
var n=$("ngn").value.trim();
if(!n){toast("Isi nama kelompok.");return}
if(M.groups.some(function(g){return norm(g.nama)===norm(n)})){toast("Nama kelompok sudah ada.");return}
M.groups.push({id:uid(),nama:n});saveM();$("ngn").value="";render();toast("Kelompok ditambahkan.")};
function renderFolders(){
var b=$("fl");b.innerHTML="";
fillSel();
if(!M.groups.length)b.appendChild(h("p","muted","Belum ada kelompok."+(isAdmin()?" Tambahkan kelompok di bawah.":"")));
M.groups.forEach(function(g){
var hd=h("div","gh");hd.style.display="flex";hd.style.justifyContent="space-between";hd.style.alignItems="center";hd.style.gap="8px";
hd.appendChild(h("span","",g.nama));
if(isAdmin()){var gz=h("button","warn","Hapus"),gs=false;gz.style.padding="1px 8px";gz.style.fontSize=".7rem";gz.title="Hapus kelompok beserta semua folder dan berkas di dalamnya";
gz.onclick=function(){
if(!gs){gs=true;gz.textContent="Yakin? Semua isi ikut terhapus";setTimeout(function(){gs=false;gz.textContent="Hapus"},3500);return}
var fids=M.folders.filter(function(x){return x.group===g.id}).map(function(x){return x.id}),ids=files.filter(function(x){return fids.indexOf(x.folder)>-1}).map(function(x){return x.id});
(ids.length?T("readwrite",["meta","blobs"],function(m,bl){ids.forEach(function(i){m.delete(i);bl.delete(i)})}):Promise.resolve()).then(function(){
M.folders=M.folders.filter(function(x){return fids.indexOf(x.id)<0});M.groups=M.groups.filter(function(x){return x.id!==g.id});files=files.filter(function(x){return fids.indexOf(x.folder)<0});
saveM();if(!fById(cur))cur=M.folders[0]&&M.folders[0].id;editF=false;render();toast("Kelompok dihapus.")},function(){toast("Gagal menghapus kelompok.")})};
hd.appendChild(gz)}
b.appendChild(hd);
var top=kids(g.id,null);
if(!top.length)b.appendChild(h("p","muted","Belum ada folder."));
(function walk(list,d){list.forEach(function(f){
var e=h("button","fbtn"+(f.id===cur?" on":""));e.style.paddingLeft=(10+d*16)+"px";
e.appendChild(h("span","",(d?"\u2514 ":"")+f.nama));e.appendChild(h("span","muted",String(cnt(f.id))));
e.onclick=function(){cur=f.id;editF=false;render()};b.appendChild(e);
walk(kids(g.id,f.id),d+1)})})(top,0);
});
}
$("af").onclick=function(){
if(!isAdmin())return;
var n=$("nf").value.trim(),g=$("ng").value;
if(!g){toast("Buat kelompok terlebih dahulu.");return}
if(!n){toast("Isi nama folder.");return}
if(dupe(g,null,n)){toast("Nama folder sudah ada di kelompok ini.");return}
var f={id:uid(),nama:n,drive:"",group:g,parent:null};M.folders.push(f);saveM();cur=f.id;editF=false;$("nf").value="";render();toast("Folder dibuat di "+gname(g)+".");
};
function safeUrl(u){try{var x=new URL(u);return x.protocol==="https:"?x.href:""}catch(e){return""}}
function renderPanel(){
var p=$("fp");p.innerHTML="";
var f=M.folders.filter(function(x){return x.id===cur})[0];
if(!f){p.appendChild(h("div","card","Belum ada folder yang dipilih."));return}
var c=h("div","card"),top=h("div","row");top.style.justifyContent="space-between";
var ttl=h("div",""),path=[],q=f;while(q){path.unshift(q.nama);q=q.parent?fById(q.parent):null}
ttl.appendChild(h("div","crumb",[gname(f.group)].concat(path.slice(0,-1)).join(" / ")));ttl.appendChild(h("h2","",f.nama));top.appendChild(ttl);
var tools=h("div","row"),u=safeUrl(f.drive);
if(u){var a=h("a","",'Buka folder di Google Drive');a.href=u;a.target="_blank";a.rel="noopener noreferrer";a.style.color="var(--accent)";a.style.fontWeight="600";tools.appendChild(a)}
if(isAdmin()){var eb=h("button","ghost",editF?"Tutup":"Ubah folder");eb.onclick=function(){editF=!editF;renderPanel()};tools.appendChild(eb)}
top.appendChild(tools);c.appendChild(top);
if(isAdmin()&&editF){
var box=h("div","");box.style.marginTop="8px";
var l1=h("label","","Nama folder"),i1=h("input");i1.value=f.nama;i1.maxLength=40;
var l2=h("label","","Tautan folder Google Drive (opsional)"),i2=h("input");i2.value=f.drive||"";i2.placeholder="https://drive.google.com/drive/folders/...";
var r=h("div","row");r.style.marginTop="10px";
var s=h("button","","Simpan");s.onclick=function(){
var n=i1.value.trim(),d=i2.value.trim();
if(!n){toast("Nama folder wajib diisi.");return}

function unggah(fl,folder){
var arr=Array.prototype.slice.call(fl),ok=0,tolak=[];
function lanjut(i){
if(i>=arr.length){render();toast(ok+" berkas diunggah."+(tolak.length?" Ditolak: "+tolak.join(", ")+".":""));return Promise.resolve()}
var f=arr[i];
if(!MIME[ext(f.name)]){tolak.push(f.name+" (format)");return lanjut(i+1)}
if(f.size>25*1048576){tolak.push(f.name+" (lebih dari 25 MB)");return lanjut(i+1)}
var meta={id:uid(),folder:folder,nama:f.name,size:f.size,oleh:me.nama,waktu:Date.now()};
return T("readwrite",["meta","blobs"],function(m,b){b.put(f,meta.id);return m.put(meta)}).then(function(){files.push(meta);ok++},function(){tolak.push(f.name+" (gagal disimpan)")}).then(function(){return lanjut(i+1)});
}
if(arr.length)lanjut(0);
}

function logo(){
var d=null;try{d=localStorage.getItem("spi-logo")}catch(e){}d=d||DEFAULT_LOGO;
["l","h"].forEach(function(k){var i=$("logo-"+k),m=$("mark-"+k);if(d){i.src=d;i.hidden=false;m.hidden=true}else{i.hidden=true;m.hidden=false}});
}
$("lg").onchange=function(ev){
var f=ev.target.files&&ev.target.files[0];if(!f||!isAdmin())return;
if(!/^image\/(png|jpeg|webp)$/.test(f.type)){toast("Pilih gambar PNG, JPG, atau WebP.");ev.target.value="";return}
if(f.size>400*1024){toast("Logo terlalu besar. Maksimal 400 KB.");ev.target.value="";return}
var r=new FileReader();r.onload=function(){if(lsSet("spi-logo",r.result)){logo();toast("Logo disimpan.")}else toast("Logo gagal disimpan.")};r.readAsDataURL(f);ev.target.value="";
};
$("lgx").onclick=function(){if(!isAdmin())return;try{localStorage.removeItem("spi-logo")}catch(e){}logo();toast("Logo dikembalikan ke logo bawaan SPI.")};
logo();
init().then(function(){
var k=null;try{k=sessionStorage.getItem(SES)}catch(e){}
var u=k&&M.users.filter(function(x){return x.key===k})[0];
if(u){me=u;tampil(true)}else tampil(false);
},function(e){$("lm").textContent=e.message});
})();
</script>
