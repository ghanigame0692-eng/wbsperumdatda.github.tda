<style>
:root{
  color-scheme: light;
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#F4F6F9; --ink:#17212F; --ink-2:#4A5668; --line:#D5DBE4;
  --brand:#243B63; --brand-ink:#FFFFFF; --brand-soft:#E4EAF4;
  --panel:#1B2E52; --panel-ink:#F0F4FA; --panel-mute:#B7C4DB;
  --seal:#B7791F; --seal-ink:#FFF6E0; --seal-bg:#FBF1DC; --seal-line:#E9D3A3;
  --info:#2A5599; --info-bg:#E3ECFA; --warn:#7A4E00; --warn-bg:#FCEFD0; --ok:#1B6240; --ok-bg:#DDF1E5; --bad:#8A2A2A; --bad-bg:#F6E0E0;
  --danger:#B3261E; --focus:#2F6FED;
  --c-baru:#3B7DD8; --c-diproses:#E0A526; --c-selesai:#2E9E67; --c-ditolak:#C94B4B;
  --font-body:'Public Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-head:'Newsreader', Georgia, 'Times New Roman', serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){

    --bg:#0F151E; --surface:#171F2B; --surface-2:#1D2735; --ink:#E6EBF2; --ink-2:#9AA7BA; --line:#2B3748;
    --brand:#8FB0E8; --brand-ink:#0F151E; --brand-soft:#1E2B44;
    --panel:#101B2E; --panel-ink:#EAF0FA; --panel-mute:#9FB0CC;
    --seal:#E0B25A; --seal-ink:#2E2615; --seal-bg:#2E2615; --seal-line:#54431F;
    --info:#8DB3F0; --info-bg:#1B2A44; --warn:#E8BF6A; --warn-bg:#33290F; --ok:#7FD3A2; --ok-bg:#13301F; --bad:#F09A9A; --bad-bg:#3A1A1A;
    --danger:#F28B82; --focus:#7FA8FF;
    --c-baru:#6FA3F0; --c-diproses:#E8BF6A; --c-selesai:#5CC08C; --c-ditolak:#E67E7E;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0F151E; --surface:#171F2B; --surface-2:#1D2735; --ink:#E6EBF2; --ink-2:#9AA7BA; --line:#2B3748;
  --brand:#8FB0E8; --brand-ink:#0F151E; --brand-soft:#1E2B44;
  --panel:#101B2E; --panel-ink:#EAF0FA; --panel-mute:#9FB0CC;
  --seal:#E0B25A; --seal-ink:#2E2615; --seal-bg:#2E2615; --seal-line:#54431F;
  --info:#8DB3F0; --info-bg:#1B2A44; --warn:#E8BF6A; --warn-bg:#33290F; --ok:#7FD3A2; --ok-bg:#13301F; --bad:#F09A9A; --bad-bg:#3A1A1A;
  --danger:#F28B82; --focus:#7FA8FF;
    --c-baru:#6FA3F0; --c-diproses:#E8BF6A; --c-selesai:#5CC08C; --c-ditolak:#E67E7E;
}
html{ scroll-padding-top:env(safe-area-inset-top,0px); background:var(--bg); height:100%; }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.55; -webkit-text-size-adjust:100%; }
h1,h2,h3{ font-family:var(--font-head); font-weight:600; line-height:1.2; margin:0; letter-spacing:-.01em; }
p{ margin:0; }
button,input,select,textarea{ font:inherit; color:inherit; }
:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
.muted{ color:var(--ink-2); }
.hint{ color:var(--ink-2); font-size:13px; }
.visually-hidden{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

/* Buttons */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid transparent; border-radius:8px; padding:10px 16px; font-weight:600; cursor:pointer; background:var(--brand); color:var(--brand-ink); text-decoration:none; line-height:1.2; }
.btn:hover{ filter:brightness(1.08); }
.btn[disabled]{ opacity:.55; cursor:progress; }
.btn.secondary{ background:transparent; color:var(--ink); border-color:var(--line); }
.btn.secondary:hover{ background:var(--surface-2); filter:none; }
.btn.ghost{ background:transparent; color:var(--ink-2); }
.btn.ghost:hover{ background:var(--surface-2); filter:none; }
.btn.danger{ background:transparent; color:var(--danger); border-color:var(--danger); }
.btn.danger:hover{ background:var(--bad-bg); filter:none; }
.btn.solid-danger{ background:var(--danger); color:#fff; }
.btn.small{ padding:6px 11px; font-size:13px; }

/* Login */
.login{ min-height:100%; display:grid; grid-template-columns:1fr; }
@media (min-width:860px){ .login{ grid-template-columns:minmax(360px,5fr) 6fr; } }
.login-panel{ background:var(--panel); color:var(--panel-ink); padding:48px 36px; display:flex; flex-direction:column; justify-content:center; gap:28px; }
.login-panel .lead{ font-size:18px; color:var(--panel-mute); max-width:34ch; }
.login-panel ul{ list-style:none; margin:0; padding:0; display:grid; gap:12px; max-width:40ch; }
.login-panel li{ padding-left:16px; border-left:2px solid var(--seal); color:var(--panel-ink); }
.login-form{ display:flex; align-items:center; justify-content:center; padding:40px 24px; }
.login-form form{ width:100%; max-width:380px; display:grid; gap:16px; }
.login-form h2{ font-size:28px; }
.seal{ width:56px; height:56px; flex:none; }
.logo{ display:block; flex:none; border-radius:50%; object-fit:cover; background:#87CEFA; }
.logo.lg{ width:120px; height:120px; }
.brandlogo{ display:block; flex:none; width:auto; background:#FFFFFF; border-radius:12px; padding:6px; border:1px solid #DDE3EC; }
.brandlogo.lg{ height:112px; }
.brandlogo.sm{ height:54px; }
.logo.sm{ width:44px; height:44px; }
.brand-text{ display:grid; line-height:1.15; }
.brand-text b{ font-family:var(--font-head); font-size:19px; font-weight:600; }
.brand-text span{ font-family:var(--font-body); font-size:12.5px; font-weight:400; color:var(--ink-2); }
.login-panel .org{ font-size:15px; color:var(--panel-mute); margin-top:-18px; }
.login-panel h1{ font-size:36px; }
.login-panel h1 small{ display:block; font-size:20px; font-weight:500; color:var(--panel-mute); margin-top:6px; }
.seal.sm{ width:30px; height:30px; }

/* Forms */
label{ display:grid; gap:6px; font-weight:500; font-size:14px; }
input[type=text],input[type=password],input[type=date],select,textarea{
  width:100%; border:1px solid var(--line); border-radius:8px; padding:10px 12px; background:var(--surface); color:var(--ink);
}
textarea{ resize:vertical; min-height:80px; }
.form{ display:grid; gap:16px; }
.grid2{ display:grid; gap:16px; grid-template-columns:1fr; }
@media (min-width:700px){ .grid2{ grid-template-columns:1fr 1fr; } .grid3{ grid-template-columns:1fr 1fr 1fr; } }
.grid3{ display:grid; gap:16px; grid-template-columns:1fr; }
.form-err{ color:var(--danger); font-size:14px; min-height:0; }
.form-err ul{ margin:0; padding-left:18px; }
.actions{ display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end; }

/* Shell */
.top{ background:var(--surface); border-bottom:1px solid var(--line); }
.top-in{ max-width:1080px; margin:0 auto; padding:12px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.brand{ display:flex; align-items:center; gap:10px; font-family:var(--font-head); font-weight:600; font-size:22px; }
.who{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.role{ font-size:12px; font-weight:600; padding:2px 9px; border-radius:99px; background:var(--brand-soft); color:var(--brand); }
.tabsbar{ background:var(--surface); border-bottom:1px solid var(--line); }
.tabs{ max-width:1080px; margin:0 auto; padding:0 12px; display:flex; gap:4px; overflow-x:auto; }
.tab{ background:none; border:0; border-bottom:3px solid transparent; padding:12px 12px 10px; cursor:pointer; color:var(--ink-2); font-weight:500; white-space:nowrap; }
.tab:hover{ color:var(--ink); }
.tab[aria-current="page"]{ color:var(--ink); font-weight:600; border-bottom-color:var(--seal); }
.wrap{ max-width:1080px; margin:0 auto; padding:28px 20px 40px; display:grid; gap:20px; }
.foot{ max-width:1080px; margin:0 auto; padding:0 20px 40px; color:var(--ink-2); font-size:13px; }
.page-head{ display:grid; gap:6px; }
.page-head h1{ font-size:30px; }
.card{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:20px; }
.card h3{ font-size:20px; margin-bottom:12px; }

/* Stats */
.stats{ display:flex; flex-wrap:wrap; background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
.stat{ flex:1 1 130px; padding:14px 18px; border-right:1px solid var(--line); }
.stat:last-child{ border-right:0; }
.stat b{ display:block; font-family:var(--font-head); font-size:28px; line-height:1.1; }
.stat span{ color:var(--ink-2); font-size:13px; }

/* Tables */
.toolbar{ display:grid; gap:10px; grid-template-columns:1fr; }
@media (min-width:760px){ .toolbar{ grid-template-columns:2fr 1fr 1fr; } }
.tablewrap{ overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:10px; }
table{ width:100%; border-collapse:collapse; min-width:720px; }
th{ text-align:left; font-size:13px; font-weight:600; color:var(--ink-2); padding:11px 14px; border-bottom:1px solid var(--line); background:var(--surface-2); }
td{ padding:12px 14px; border-bottom:1px solid var(--line); vertical-align:top; }
tr:last-child td{ border-bottom:0; }
td .code{ font-size:13px; color:var(--ink-2); font-variant-numeric:tabular-nums; }
.empty{ padding:36px 20px; text-align:center; color:var(--ink-2); display:grid; gap:12px; justify-items:center; }

.badge{ display:inline-block; padding:2px 10px; border-radius:99px; font-size:12.5px; font-weight:600; }
.badge.baru{ background:var(--info-bg); color:var(--info); }
.badge.diproses{ background:var(--warn-bg); color:var(--warn); }
.badge.selesai{ background:var(--ok-bg); color:var(--ok); }
.badge.ditolak{ background:var(--bad-bg); color:var(--bad); }

/* Confidentiality note */
.confid{ display:flex; gap:12px; align-items:center; background:var(--seal-bg); border:1px solid var(--seal-line); border-radius:10px; padding:12px 14px; font-size:14px; }

/* Detail */
.detail-head{ display:grid; gap:8px; }
.detail-head h1{ font-size:28px; }
.meta-row{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; color:var(--ink-2); font-size:14px; }
.facts{ display:grid; gap:14px 20px; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); }
.facts dt{ font-size:13px; color:var(--ink-2); }
.facts dd{ margin:0; font-weight:500; }
.longtext{ white-space:pre-wrap; overflow-wrap:anywhere; }
.reporter{ border:1px dashed var(--seal); background:var(--seal-bg); border-radius:10px; padding:12px 14px; display:grid; gap:2px; }
.filelist{ list-style:none; margin:0; padding:0; display:grid; gap:8px; }
.filelist li{ display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; border:1px solid var(--line); border-radius:8px; padding:10px 12px; background:var(--surface-2); }
.filelist .fname{ font-weight:500; overflow-wrap:anywhere; }
.filelist .finfo{ display:grid; gap:0; min-width:0; }
.filebtn{ cursor:pointer; }
input.visually-hidden:focus-visible + .filebtn{ outline:2px solid var(--focus); outline-offset:2px; }
.row-actions{ display:flex; gap:10px; flex-wrap:wrap; }
.response{ border-left:3px solid var(--brand); padding:4px 0 4px 14px; }

/* Master lists */
.masters{ display:grid; gap:16px; grid-template-columns:1fr; }
@media (min-width:800px){ .masters{ grid-template-columns:1fr 1fr; } }
.chips{ list-style:none; margin:0 0 14px; padding:0; display:flex; flex-wrap:wrap; gap:8px; }
.chips li{ display:inline-flex; align-items:center; gap:4px; background:var(--surface-2); border:1px solid var(--line); border-radius:99px; padding:3px 4px 3px 12px; font-size:14px; }
.chips button{ border:0; background:none; cursor:pointer; width:24px; height:24px; border-radius:99px; color:var(--ink-2); font-size:16px; line-height:1; }
.chips button:hover{ background:var(--bad-bg); color:var(--bad); }
.inline-add{ display:flex; gap:8px; }
.inline-add input{ flex:1; min-width:0; }

dialog{ border:1px solid var(--line); border-radius:12px; background:var(--surface); color:var(--ink); padding:22px; width:min(480px,92%); }
dialog::backdrop{ background:rgba(8,12,20,.6); }
.dlg h2{ font-size:24px; }

.recap-status{ display:flex; gap:28px; align-items:center; flex-wrap:wrap; }
.donut{ width:190px; height:190px; flex:none; }
.d-num{ font:600 24px var(--font-head); fill:var(--ink); }
.d-lbl{ font:400 9px var(--font-body); fill:var(--ink-2); }
.legend{ border-collapse:collapse; min-width:0; width:auto; }
.legend th{ background:none; padding:6px 16px 6px 0; }
.legend td{ padding:7px 16px 7px 0; border-bottom:1px solid var(--line); }
.legend tr:last-child td{ border-bottom:0; }
.legend .tot td{ font-weight:600; }
.swatch{ display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:8px; vertical-align:-1px; }
.bars{ list-style:none; margin:0; padding:0; display:grid; gap:12px; }
.bar-top{ display:flex; justify-content:space-between; gap:10px; font-size:14px; }
.track{ height:8px; background:var(--surface-2); border:1px solid var(--line); border-radius:99px; overflow:hidden; }
.fill{ height:100%; background:var(--brand); }
.logobar{ background:#FFFFFF; border-bottom:1px solid #DDE3EC; }
.logobar-in{ max-width:1080px; margin:0 auto; padding:8px 20px; display:flex; align-items:center; gap:26px; flex-wrap:wrap; }
.plate{ background:#FFFFFF; border-radius:14px; padding:12px 18px; display:flex; align-items:center; gap:22px; flex-wrap:wrap; align-self:flex-start; }
.partner{ display:block; width:auto; flex:none; }
.partner.pemda{ height:56px; } .partner.pdam{ height:58px; } .partner.reang{ height:44px; }
@media (max-width:560px){ .partner.pemda{ height:42px; } .partner.pdam{ height:44px; } .partner.reang{ height:34px; } .logobar-in,.plate{ gap:16px; } }
.toasts{ position:fixed; left:0; right:0; bottom:0; padding:0 16px calc(18px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; z-index:50; }
.toast{ background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:8px; font-size:14px; max-width:520px; box-shadow:0 6px 24px rgba(0,0,0,.25); }
.toast.err{ background:var(--danger); color:#fff; }
.banner{ background:var(--warn-bg); color:var(--warn); padding:8px 20px; font-size:14px; text-align:center; }
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
</style>

/* ---------- Penyimpanan (IndexedDB, cadangan memori) ---------- */
const store = (function () {
  const mem = new Map(); let idb = null, ok = true;
  const open = () => new Promise((res, rej) => {
    try {
      const rq = indexedDB.open('lapor-aman-v1', 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore('kv');
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error);
      rq.onblocked = () => rej(new Error('blocked'));
    } catch (e) { rej(e); }
  });
  const run = (mode, fn) => new Promise((res, rej) => {
    const t = idb.transaction('kv', mode); const rq = fn(t.objectStore('kv'));
    t.oncomplete = () => res(rq ? rq.result : undefined);
    t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
  return {
    async init() { try { idb = await open(); } catch (e) { ok = false; } return ok; },
    get persistent() { return ok; },
    async get(k) { if (!ok) return mem.get(k); try { return await run('readonly', s => s.get(k)); } catch (e) { return mem.get(k); } },
    async set(k, v) { if (!ok) { mem.set(k, v); return; } try { await run('readwrite', s => s.put(v, k)); } catch (e) { ok = false; mem.set(k, v); throw e; } },
    async del(k) { if (!ok) { mem.delete(k); return; } try { await run('readwrite', s => s.delete(k)); } catch (e) { mem.delete(k); } }
  };
})();

async function hashPw(pw, salt) {
  try {
    if (window.crypto && crypto.subtle) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('lapor-aman:' + salt + ':' + pw));
      return 's:' + Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }
  } catch (e) {}
  return 'p:' + pw;
}

/* ---------- Unduhan ---------- */
let dlP = null;
function getDl() {
  if (dlP) return dlP;
  if (!(window.claude && typeof window.claude.use === 'function')) return Promise.resolve(null);
  dlP = window.claude.use('downloads').then(x => x || null).catch(() => null);
  return dlP;
}
async function saveFile(filename, blob) {
  const dl = await getDl();
  if (dl) {
    try { await dl.save({ filename, data: blob }); toast('Berkas siap: ' + filename); }
    catch (e) { if (e && e.code === 'declined') return; toast('Berkas tidak dapat disimpan' + (e && e.code ? ' (' + e.code + ')' : '') + '.', 'err'); }
    return;
  }
  try {
    const url = URL.createObjectURL(blob); const a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000); toast('Berkas diunduh: ' + filename);
  } catch (e) { toast('Unduhan tidak didukung di tampilan ini.', 'err'); }
}

/* ---------- Pembuat PDF (pdf-lib) ---------- */
const okCache = new WeakMap();
function sanitize(font, s) {
  let c = okCache.get(font); if (!c) { c = new Map(); okCache.set(font, c); }
  s = String(s == null ? '' : s).replace(/\r\n?/g, '\n').replace(/\t/g, '    ').replace(/[\u2028\u2029]/g, '\n');
  let out = '';
  for (const ch of s) {
    if (ch === '\n') { out += ch; continue; }
    let ok = c.get(ch);
    if (ok === undefined) { try { font.encodeText(ch); ok = true; } catch (e) { ok = false; } c.set(ch, ok); }
    out += ok ? ch : '?';
  }
  return out;
}
function wrap(text, font, size, maxW) {
  const out = [];
  for (const raw of text.split('\n')) {
    if (!raw.trim()) { out.push(''); continue; }
    let line = '';
    for (const word of raw.split(/\s+/).filter(Boolean)) {
      const test = line ? line + ' ' + word : word;
      if (font.widthOfTextAtSize(test, size) <= maxW) { line = test; continue; }
      if (line) { out.push(line); line = ''; }
      if (font.widthOfTextAtSize(word, size) <= maxW) { line = word; continue; }
      let chunk = '';
      for (const ch of word) {
        if (font.widthOfTextAtSize(chunk + ch, size) > maxW) { out.push(chunk); chunk = ch; } else chunk += ch;
      }
      line = chunk;
    }
    out.push(line);
  }
  return out;
}


async function letterhead(doc, page, o) {
  const { rgb } = PDFLib; const W = o.W, H = o.H, M = o.M;
  const navy = rgb(.14, .23, .39), white = rgb(1, 1, 1), soft = rgb(.8, .86, .95);
  const hs = { pemda: 50, reang: 38 }; let x = M;
  for (const k of ['pemda', 'reang']) {
    try {
      const img = await doc.embedPng(b64ToBytes(LOGO_PNG[k]));
      const hh = hs[k], w = img.width * hh / img.height;
      page.drawImage(img, { x, y: H - 14 - 54 + (54 - hh) / 2, width: w, height: hh }); x += w + 22;
    } catch (e) {}
  }
  const top = H - 76;
  page.drawRectangle({ x: 0, y: top - 92, width: W, height: 92, color: navy });
  let tx = M;
  try {
    const img = await doc.embedPng(b64ToBytes(LOGO_PNG.pdam));
    page.drawRectangle({ x: M, y: top - 84, width: 76, height: 76, color: white });
    page.drawImage(img, { x: M + 4, y: top - 84 + (76 - 68 * img.height / img.width) / 2, width: 68, height: 68 * img.height / img.width }); tx = M + 92;
  } catch (e) {}
  o.titles.forEach(t => {
    const f = t.b ? o.bold : o.reg;
    page.drawText(sanitize(f, t.t), { x: tx, y: top - t.dy, size: t.size, font: f, color: t.b ? white : soft });
  });
  if (o.code) {
    const c = sanitize(o.bold, o.code);
    page.drawText(c, { x: W - M - o.bold.widthOfTextAtSize(c, 10), y: top - 69, size: 10, font: o.bold, color: white });
  }
  return top - 92 - 24;
}

async function buildReportPdf(r, reveal) {
  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const doc = await PDFDocument.create();
  doc.setTitle('Laporan Pengaduan ' + r.code); doc.setCreator('WBS ' + ORG); doc.setProducer('WBS ' + ORG);
  const reg = await doc.embedFont(StandardFonts.Helvetica);
  const bold = await doc.embedFont(StandardFonts.HelveticaBold);
  const W = 595.28, H = 841.89, M = 56, CW = W - 2 * M;
  const ink = rgb(.09, .13, .18), mute = rgb(.35, .4, .47), navy = rgb(.14, .23, .39), line = rgb(.82, .85, .89);
  let page, y;
  const newPage = () => { page = doc.addPage([W, H]); y = H - M; };
  const ensure = h => { if (y - h < M + 14) newPage(); };

async function buildFullPdf(r, reveal) {
  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const base = await buildReportPdf(r, reveal);
  const out = await PDFDocument.load(base);
  const reg = await out.embedFont(StandardFonts.Helvetica);
  const bold = await out.embedFont(StandardFonts.HelveticaBold);
  const W = 595.28, H = 841.89, M = 56;
  for (let i = 0; i < r.files.length; i++) {
    const f = r.files[i];
    const cover = out.addPage([W, H]);
    cover.drawText('Lampiran ' + (i + 1), { x: M, y: H - 120, size: 24, font: bold, color: rgb(.14, .23, .39) });
    wrap(sanitize(reg, f.name), reg, 13, W - 2 * M).forEach((ln, j) => cover.drawText(ln, { x: M, y: H - 152 - j * 18, size: 13, font: reg, color: rgb(.09, .13, .18) }));
    const info = sanitize(reg, fmtSize(f.size) + '  |  ditambahkan oleh ' + (f.by === 'admin' ? 'Admin' : 'pelapor') + '  |  ' + fmtDT(f.at));
    cover.drawText(info, { x: M, y: H - 200, size: 10, font: reg, color: rgb(.35, .4, .47) });
    try {
      const bytes = await getFile(f.id);
      if (!bytes) throw new Error('kosong');
      const src = await PDFDocument.load(bytes, { ignoreEncryption: true });
      const pgs = await out.copyPages(src, src.getPageIndices());
      pgs.forEach(p => out.addPage(p));
    } catch (e) {
      cover.drawText('Berkas ini tidak dapat digabungkan. Unduh lampiran secara terpisah.', { x: M, y: H - 232, size: 10.5, font: bold, color: rgb(.7, .15, .15) });
    }
  }
  return out.save();
}

async function runMgmt(btn) {
  const me = getMe(); if (!me || me.role !== 'admin') return;
  if (S.recap.from && S.recap.to && S.recap.from > S.recap.to) { toast('Tanggal awal harus sebelum tanggal akhir.', 'err'); return; }
  if (!window.PDFLib) { toast('Pustaka PDF belum termuat. Periksa koneksi internet, lalu muat ulang halaman.', 'err'); return; }
  const old = btn.textContent; btn.disabled = true; btn.textContent = 'Menyiapkan...';
  try {
    await loadAll();
    const bytes = await buildMgmtPdf(recapList(), me);
    await saveFile('Laporan-Manajemen-WBS-' + todayStr() + '.pdf', new Blob([bytes], { type: 'application/pdf' }));
  } catch (e) { toast('Gagal membuat PDF laporan manajemen.', 'err'); }
  finally { btn.disabled = false; btn.textContent = old; }
}

async function runDownload(btn, id, kind, fileId) {
  const me = getMe(); const r = D.reports.find(x => x.id === id);
  if (!me || !r || (me.role !== 'admin' && r.userId !== me.id)) { toast('Laporan tidak ditemukan.', 'err'); return; }
  const reveal = me.role === 'admin';
  const old = btn ? btn.textContent : ''; if (btn) { btn.disabled = true; btn.textContent = 'Menyiapkan...'; }
  try {
    if (kind === 'file') {
      const f = r.files.find(x => x.id === fileId); const buf = f && await getFile(f.id);
      if (!buf) throw new Error('Berkas tidak ditemukan');
      await saveFile(/\.pdf$/i.test(f.name) ? f.name : f.name + '.pdf', new Blob([buf], { type: 'application/pdf' }));
    } else {
      if (!window.PDFLib) throw new Error('Pustaka PDF belum termuat. Periksa koneksi internet, lalu muat ulang halaman.');
      const bytes = kind === 'full' ? await buildFullPdf(r, reveal) : await buildReportPdf(r, reveal);
      await saveFile('Laporan-' + r.code + (kind === 'full' ? '-lengkap' : '') + '.pdf', new Blob([bytes], { type: 'application/pdf' }));
    }
  } catch (e) { toast(e && e.message ? e.message : 'Gagal membuat PDF.', 'err'); }
  finally { if (btn) { btn.disabled = false; btn.textContent = old; } }
}

/* ---------- Validasi berkas PDF ---------- */
async function checkPdf(file) {
  if (!/\.pdf$/i.test(file.name) && file.type !== 'application/pdf') return 'Berkas "' + file.name + '" bukan PDF.';
  if (file.size > MAX_BYTES) return 'Berkas "' + file.name + '" melebihi 10 MB.';
  if (file.size === 0) return 'Berkas "' + file.name + '" kosong.';
  try { const head = await file.slice(0, 1024).text(); if (head.indexOf('%PDF-') === -1) return 'Isi "' + file.name + '" bukan PDF yang valid.'; } catch (e) { return 'Berkas "' + file.name + '" tidak dapat dibaca.'; }
  return null;
}

/* ---------- Grafik dan rekap untuk manajemen ---------- */
const STATUS_COLOR = { baru: 'var(--c-baru)', diproses: 'var(--c-diproses)', selesai: 'var(--c-selesai)', ditolak: 'var(--c-ditolak)' };
function recapList() {
  const f = S.recap.from, t = S.recap.to;
  return D.reports.filter(r => { const d = dayOf(r.createdAt); return (!f || d >= f) && (!t || d <= t); });
}
function countBy(list, key) {
  const m = new Map(); list.forEach(r => { const k = r[key] || 'Tidak diisi'; m.set(k, (m.get(k) || 0) + 1); });
  return Array.from(m, e => ({ label: e[0], n: e[1] })).sort((a, b) => b.n - a.n || a.label.localeCompare(b.label));
}
function statusCounts(list) { const o = {}; Object.keys(STATUS).forEach(k => { o[k] = list.filter(r => r.status === k).length; }); return o; }
function summaryText(list) {
  const t = list.length; if (!t) return 'Belum ada laporan pada periode ini.';
  const c = statusCounts(list); const x = k => c[k] + ' (' + fmtPct(pct(c[k], t)) + ')';
  return 'Dari ' + t + ' laporan yang masuk, ' + x('selesai') + ' telah selesai, ' + x('diproses') + ' sedang diproses, ' + x('baru') + ' masih baru, dan ' + x('ditolak') + ' ditolak.';
}
function donut(list) {
  const total = list.length, C = 2 * Math.PI * 46; let off = 0; const c = statusCounts(list);
  const parts = total ? Object.keys(STATUS).filter(k => c[k]).map(k => {
    const len = C * c[k] / total;
    const el = '<circle cx="60" cy="60" r="46" fill="none" stroke="' + STATUS_COLOR[k] + '" stroke-width="20" stroke-dasharray="' + len.toFixed(3) + ' ' + (C - len).toFixed(3) + '" stroke-dashoffset="' + (-off).toFixed(3) + '" transform="rotate(-90 60 60)"></circle>';
    off += len; return el;
  }).join('') : '';
  return '<svg class="donut" viewBox="0 0 120 120" role="img" aria-label="Diagram lingkaran persentase laporan menurut status"><circle cx="60" cy="60" r="46" fill="none" stroke="var(--line)" stroke-width="20"></circle>' + parts +
    '<text x="60" y="58" text-anchor="middle" class="d-num">' + total + '</text><text x="60" y="73" text-anchor="middle" class="d-lbl">laporan</text></svg>';
}
function statusLegend(list) {
  const t = list.length, c = statusCounts(list);
  return '<table class="legend"><thead><tr><th>Status</th><th>Jumlah</th><th>Persentase</th></tr></thead><tbody>' +
    '<tr class="tot"><td>Total laporan</td><td>' + t + '</td><td>' + (t ? '100%' : '0%') + '</td></tr>' +
    Object.keys(STATUS).map(k => '<tr><td><span class="swatch" style="background:' + STATUS_COLOR[k] + '"></span>' + STATUS[k] + '</td><td>' + c[k] + '</td><td>' + fmtPct(pct(c[k], t)) + '</td></tr>').join('') + '</tbody></table>';
}
function barCard(title, items, total) {
  return '<section class="card"><h3>' + title + '</h3>' + (items.length ? '<ul class="bars">' + items.map(i => {
    const p = pct(i.n, total);
    return '<li><div class="bar-top"><span>' + esc(i.label) + '</span><span class="muted">' + i.n + ' (' + fmtPct(p) + ')</span></div><div class="track"><div class="fill" style="width:' + p.toFixed(1) + '%"></div></div></li>';
  }).join('') + '</ul>' : '<p class="muted">Belum ada data.</p>') + '</section>';
}
function recapBody() {
  const list = recapList(), t = list.length;
  return '<section class="card"><h3>Persentase laporan berdasarkan status</h3><div class="recap-status">' + donut(list) + '<div>' + statusLegend(list) + '</div></div>' +
    '<p class="muted" style="margin-top:14px">' + esc(summaryText(list)) + '</p></section>' +
    '<div class="masters">' + barCard('Menurut kategori laporan', countBy(list, 'category'), t) + barCard('Menurut cabang', countBy(list, 'branch'), t) +
    barCard('Menurut unit', countBy(list, 'unit'), t) + barCard('Menurut bagian', countBy(list, 'section'), t) + '</div>';
}

/* ---------- Dialog ---------- */
function openDialog(html) {
  const dlg = document.createElement('dialog'); dlg.innerHTML = html; document.body.appendChild(dlg);
  dlg.addEventListener('close', () => dlg.remove());
  dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
  dlg.showModal(); return dlg;
}

/* ---------- Aksi ---------- */
function newCode() {
  const d = todayStr().replace(/-/g, ''); const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  for (;;) {
    let s = ''; for (let i = 0; i < 4; i++) s += chars[Math.floor(Math.random() * chars.length)];
    const code = 'WBS-' + d + '-' + s; if (!D.reports.some(r => r.code === code)) return code;
  }
}

async function addFilesToReport(r, fileList, by) {
  let added = 0;
  for (const file of Array.from(fileList)) {
    if (r.files.length >= 10) { toast('Satu laporan maksimal 10 lampiran.', 'err'); break; }
    const err = await checkPdf(file); if (err) { toast(err, 'err'); continue; }
    const fid = uid(); await store.set('file:' + fid, await file.arrayBuffer());
    r.files.push({ id: fid, name: file.name, size: file.size, by, at: new Date().toISOString() }); added++;
  }
  if (added) { r.updatedAt = new Date().toISOString(); await save('reports'); toast(added + ' bukti PDF ditambahkan.'); }
  return added;
}

async function onLogin(form) {
  const f = new FormData(form); const u = normUser(f.get('username')); const p = String(f.get('password') || '');
  const err = $('#loginErr');
  if (Date.now() < S.lockUntil) { err.textContent = 'Terlalu banyak percobaan. Tunggu 30 detik lalu coba lagi.'; return; }
  const user = D.users.find(x => x.username === u);
  const ok = user && (await hashPw(p, user.id)) === user.pw;
  if (!ok) { S.fails++; if (S.fails >= 5) { S.lockUntil = Date.now() + 30000; S.fails = 0; } err.textContent = 'Username atau kata sandi salah.'; return; }
  S.fails = 0; S.meId = user.id; S.tab = user.role === 'admin' ? 'laporan' : 'saya'; S.detail = null;
  try { sessionStorage.setItem('lapor-aman-me', user.id); } catch (e) {}
  await loadAll(); render();
}

async function onReport(form) {
  const me = getMe(); const f = new FormData(form); const v = n => String(f.get(n) || '').trim();
  const rec = { cat: v('cat'), date: v('date'), branch: v('branch'), unit: v('unit'), section: v('section'), location: v('location'), title: v('title'), description: v('description'), parties: v('parties') };
  const errs = [];
  if (!rec.cat) errs.push('Pilih kategori laporan.');
  if (!rec.date) errs.push('Isi tanggal kejadian.'); else if (rec.date > todayStr()) errs.push('Tanggal kejadian tidak boleh di masa depan.');
  if (!rec.branch) errs.push('Pilih cabang.');
  if (!rec.unit) errs.push('Pilih unit.');
  if (!rec.title) errs.push('Isi judul laporan.');
  if (rec.description.length < 20) errs.push('Uraian kejadian minimal 20 karakter.');
  const box = $('#formErr');
  if (errs.length) { box.innerHTML = '<ul>' + errs.map(e => '<li>' + esc(e) + '</li>').join('') + '</ul>'; return; }
  box.innerHTML = '';
  const btn = form.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'Mengirim...';
  try {
    const now = new Date().toISOString();
    const r = { id: uid(), code: newCode(), userId: me.id, category: rec.cat, branch: rec.branch, unit: rec.unit, section: rec.section, location: rec.location, title: rec.title, description: rec.description, parties: rec.parties, date: rec.date, status: 'baru', response: '', files: [], createdAt: now, updatedAt: now };
    for (const d of S.draft) {
      const fid = uid(); await store.set('file:' + fid, await d.file.arrayBuffer());
      r.files.push({ id: fid, name: d.name, size: d.size, by: 'user', at: now });
    }
    D.reports.push(r); await save('reports');
    S.draft = []; S.detail = r.id; S.tab = 'saya'; render(); window.scrollTo(0, 0);
    toast('Laporan terkirim. Kode laporan: ' + r.code);
  } catch (e) { toast('Laporan gagal disimpan. Coba lagi.', 'err'); btn.disabled = false; btn.textContent = 'Kirim laporan'; }
}

async function onProcess(form) {
  const r = D.reports.find(x => x.id === form.dataset.id); if (!r) return;
  const f = new FormData(form); r.status = String(f.get('status')); r.response = String(f.get('response') || '').trim(); r.updatedAt = new Date().toISOString();
  await save('reports'); toast('Penanganan disimpan.'); render();
}

async function onAddUser(form) {
  const f = new FormData(form); const name = String(f.get('name') || '').trim(); const username = normUser(f.get('username')); const pw = String(f.get('password') || ''); const role = f.get('role') === 'admin' ? 'admin' : 'user';
  const err = $('#userErr');
  if (!name) { err.textContent = 'Isi nama tampilan.'; return; }
  if (!/^[a-z0-9._-]{2,30}$/.test(username)) { err.textContent = 'Username 2 sampai 30 karakter: huruf, angka, titik, garis bawah, atau tanda hubung.'; return; }
  if (D.users.some(u => u.username === username)) { err.textContent = 'Username sudah dipakai.'; return; }
  if (pw.length < 5) { err.textContent = 'Kata sandi minimal 5 karakter.'; return; }
  const id = uid(); D.users.push({ id, username, name, pw: await hashPw(pw, id), role, createdAt: new Date().toISOString() });
  await save('users'); toast('Pengguna "' + name + '" ditambahkan.'); render();
}

async function onEditUser(form) {
  const u = D.users.find(x => x.id === form.dataset.id); if (!u) return;
  const f = new FormData(form); const name = String(f.get('name') || '').trim(); const username = normUser(f.get('username')); const pw = String(f.get('password') || ''); const role = f.get('role') === 'admin' ? 'admin' : 'user';
  const err = $('#dlgErr');
  if (!name) { err.textContent = 'Isi nama tampilan.'; return; }
  if (!/^[a-z0-9._-]{2,30}$/.test(username)) { err.textContent = 'Username 2 sampai 30 karakter: huruf, angka, titik, garis bawah, atau tanda hubung.'; return; }
  if (D.users.some(x => x.id !== u.id && x.username === username)) { err.textContent = 'Username sudah dipakai.'; return; }
  if (pw && pw.length < 5) { err.textContent = 'Kata sandi minimal 5 karakter.'; return; }
  if (u.role === 'admin' && role !== 'admin' && D.users.filter(x => x.role === 'admin').length < 2) { err.textContent = 'Harus ada minimal satu Admin.'; return; }
  u.name = name; u.username = username; u.role = role; if (pw) u.pw = await hashPw(pw, u.id);
  await save('users'); form.closest('dialog').close(); toast('Data pengguna diperbarui.');
  if (S.meId === u.id && u.role !== 'admin') S.tab = 'saya';
  render();
}

async function onMaster(form) {
  const key = form.dataset.key; const val = String(new FormData(form).get('value') || '').trim();
  if (!val) return;
  if (D[key].some(x => x.toLowerCase() === val.toLowerCase())) { toast('Data tersebut sudah ada.', 'err'); return; }
  D[key].push(val); await save(key); toast('Ditambahkan: ' + val); render();
}

document.addEventListener('submit', async e => {
  const form = e.target.closest('[data-form]'); if (!form) return; e.preventDefault();
  try {
    switch (form.dataset.form) {
      case 'login': await onLogin(form); break;
      case 'report': await onReport(form); break;
      case 'process': await onProcess(form); break;
      case 'add-user': await onAddUser(form); break;
      case 'edit-user': await onEditUser(form); break;
      case 'master': await onMaster(form); break;
    }
  } catch (err) { toast('Terjadi kesalahan. Coba lagi.', 'err'); }
});

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, me = getMe();
  switch (a) {
    case 'tab': await go(el.dataset.tab); break;
    case 'open': await openReport(el.dataset.id); break;
    case 'back': S.detail = null; await loadAll(); render(); window.scrollTo(0, 0); break;
    case 'logout':
      S.meId = null; S.detail = null; S.tab = ''; S.draft = [];
      try { sessionStorage.removeItem('lapor-aman-me'); } catch (x) {}
      render(); break;
    case 'dl-report': await runDownload(el, el.dataset.id, 'report'); break;
    case 'dl-full': await runDownload(el, el.dataset.id, 'full'); break;
    case 'dl-file': await runDownload(el, el.dataset.id, 'file', el.dataset.file); break;
    case 'draft-remove': S.draft.splice(Number(el.dataset.i), 1); updateDraftList(); break;
    case 'close-dialog': el.closest('dialog').close(); break;
    case 'dl-mgmt': await runMgmt(el); break;
    case 'recap-reset': S.recap.from = ''; S.recap.to = ''; render(); break;
    case 'edit-user': {
      const u = D.users.find(x => x.id === el.dataset.id); if (!u || !me || me.role !== 'admin') break;
      openDialog('<form data-form="edit-user" data-id="' + esc(u.id) + '" class="form dlg"><h2>Ubah pengguna</h2>' +
        '<label>Nama tampilan<input type="text" name="name" maxlength="60" value="' + esc(u.name) + '"></label>' +
        '<label>Username<input type="text" name="username" maxlength="30" value="' + esc(u.username) + '" autocapitalize="off" autocomplete="off" spellcheck="false"></label>' +
        '<label>Peran<select name="role"><option value="user"' + (u.role === 'user' ? ' selected' : '') + '>Pengguna</option><option value="admin"' + (u.role === 'admin' ? ' selected' : '') + '>Admin</option></select></label>' +
        '<label>Kata sandi baru<input type="password" name="password" autocomplete="new-password" placeholder="Kosongkan jika tidak diubah"></label>' +
        '<p class="form-err" id="dlgErr" role="alert"></p><div class="actions"><button type="button" class="btn secondary" data-act="close-dialog">Batal</button><button class="btn" type="submit">Simpan</button></div></form>');
      break;
    }
    case 'm-del': {
      const k = el.dataset.key, i = Number(el.dataset.i); const removed = D[k].splice(i, 1)[0];
      await save(k); toast('Dihapus: ' + removed); render(); break;
    }
    case 'del-report': {
      openDialog('<div class="form dlg"><h2>Hapus laporan?</h2><p>Laporan beserta semua lampirannya akan dihapus permanen dan tidak dapat dikembalikan. Unduh salinannya lebih dulu jika masih diperlukan.</p>' +
        '<div class="actions"><button type="button" class="btn secondary" data-act="close-dialog">Batal</button><button type="button" class="btn solid-danger" data-act="del-report-confirm" data-id="' + esc(el.dataset.id) + '">Hapus permanen</button></div></div>');
      break;
    }
    case 'del-report-confirm': {
      if (!me || me.role !== 'admin') break;
      const i = D.reports.findIndex(x => x.id === el.dataset.id); if (i < 0) break;
      const r = D.reports.splice(i, 1)[0];
      for (const f of r.files) await store.del('file:' + f.id);
      await save('reports'); el.closest('dialog').close(); S.detail = null; toast('Laporan ' + r.code + ' dihapus.'); render(); window.scrollTo(0, 0); break;
    }
  }
});

document.addEventListener('input', e => {
  const el = e.target.closest('[data-filter]'); if (!el) return;
  S.filters[el.dataset.filter] = el.value;
  const t = $('#reportTable'); if (t) t.innerHTML = reportTable(adminFiltered(), true);
});

document.addEventListener('input', e => {
  const el = e.target.closest('[data-recap]'); if (!el) return;
  S.recap[el.dataset.recap] = el.value;
  if (el.dataset.recap !== 'note') { const b = $('#recapBody'); if (b) b.innerHTML = recapBody(); }
});

document.addEventListener('change', async e => {
  const el = e.target;
  if (el.id === 'evidence') {
    for (const file of Array.from(el.files)) {
      if (S.draft.length >= MAX_FILES) { toast('Maksimal ' + MAX_FILES + ' berkas per laporan.', 'err'); break; }
      const err = await checkPdf(file); if (err) { toast(err, 'err'); continue; }
      S.draft.push({ file, name: file.name, size: file.size });
    }
    el.value = ''; updateDraftList();
  } else if (el.id === 'addEvidence') {
    const me = getMe(); const r = D.reports.find(x => x.id === el.dataset.id);
    if (!me || !r || (me.role !== 'admin' && r.userId !== me.id)) return;
    try { await addFilesToReport(r, el.files, me.role === 'admin' ? 'admin' : 'user'); } catch (x) { toast('Berkas gagal disimpan.', 'err'); }
    el.value = ''; render();
  }
});

/* ---------- Mulai ---------- */
(async function boot() {
  await store.init(); await loadAll(); await seed();
  try { S.meId = sessionStorage.getItem('lapor-aman-me'); } catch (e) {}
  if (S.meId && !getMe()) S.meId = null;
  getDl();
  render();
})();
})();
</script>
</body>
</html>
